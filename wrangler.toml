name = "dannytrade"
main = "worker/index.js"
compatibility_date = "2026-07-01"
keep_vars = true

# Serves the existing static site (index.html, studio.html, style.css,
# assets/js/*, etc.) unchanged. The Worker only intercepts /api/analyze;
# every other request falls through to these assets.
[assets]
directory = "./"
binding = "ASSETS"

# GEMINI_API_KEY is already stored as a secret (wrangler secret put
# GEMINI_API_KEY) — do not add it here.
[vars]
GEMINI_MODEL = "gemini-3.6-flash"

# Phase 2C, Step 2 persists the FYERS OAuth access_token (and its
# expiry) across requests and Worker isolate recycles. Nothing reads
# or writes this namespace yet — that starts in Step 3 (OAuth login/
# callback routes). No refresh_token/PIN logic is stored here or
# anywhere else in this project (Phase 2C Decision B: manual daily
# re-login only, no auto-refresh).
#
# SETUP REQUIRED (run once, outside this repo, before Step 3 is
# deployed): `wrangler kv namespace create FYERS_TOKENS` prints a
# namespace id. Replace the id below if you create a different
# namespace.
[[kv_namespaces]]
binding = "FYERS_TOKENS"
id = "9bcd786979a94628826c9c35ff08fa01"
