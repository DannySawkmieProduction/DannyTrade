name = "dannytrade"
main = "worker/index.js"
compatibility_date = "2026-07-01"
keep_vars = true

# Serves the existing static site (index.html, studio.html, style.css,
# assets/js/*, etc.) unchanged. The Worker only intercepts /api/analyze
# (and /api/analyze/status, /api/fyers/*); every other request falls
# through to these assets.
[assets]
directory = "./"
binding = "ASSETS"

# GEMINI_API_KEY is already stored as a secret (wrangler secret put
# GEMINI_API_KEY) — do not add it here.
#
# OpenRouter integration — OPENROUTER_API_KEY must also be set as a
# secret (wrangler secret put OPENROUTER_API_KEY) — do not add it
# here either. OPENROUTER_MODEL below is the one place to change
# which model OpenRouter routes to — no code change needed to switch it.
#
# "openrouter/free" WAS OpenRouter's own official $0-cost auto-router —
# it randomly selects among currently-available :free models and filters
# for ones that support structured JSON output. Kept here for history:
# this random-router behavior was diagnosed (Phase 2 forensic report) as
# the source of inconsistent latency and inconsistent schema-compliance
# across requests, since a different underlying model could answer each
# time. Superseded below by a pinned model — see PHASE 3 note.
#
# PHASE 3 STABILIZATION — pinned to a specific model instead of the
# auto-router. "openai/gpt-oss-20b:free" was verified live against
# OpenRouter's current model catalogue (openrouter.ai/openai/gpt-oss-20b:free)
# before this change:
#   - currently listed as free (price: Free)
#   - explicitly documented as supporting function calling, tool use,
#     AND structured outputs — not just generic chat
#   - Mixture-of-Experts, 3.6B active parameters per token — specifically
#     optimized by OpenAI for lower-latency inference, which matters for
#     an interactive chart UI
#   - 131K context window, comfortably larger than the candle-array
#     payload this app sends
#   - served by 12 different hosting providers on OpenRouter ("higher
#     uptime"), so one overloaded/down provider is less likely to take
#     the whole integration down than a thin single-provider :free
#     listing would
# Free-tier availability can still change without notice — if this ID
# is ever delisted, replace it with a current :free entry from
# https://openrouter.ai/models?fmt=table&max_price=0, verified live the
# same way, and change ONLY this one line — no code change is required,
# since worker/openrouter.js reads env.OPENROUTER_MODEL dynamically; the
# model string is never hardcoded in application logic.
[vars]
# NOT CHANGED from your explicit instruction in this conversation:
# GEMINI_MODEL stays "gemini-3-flash-preview". Note for the record —
# the wrangler.toml inside the uploaded ZIP actually contained
# "gemini-3.6-flash" here, which contradicts the ZIP's own prompt
# claiming "gemini-3-flash-preview" was the current file value. Since
# you explicitly confirmed "gemini-3-flash-preview" moments earlier in
# this same conversation, that's what's preserved below — flagging the
# mismatch rather than silently picking one.
GEMINI_MODEL = "gemini-3-flash-preview"
OPENROUTER_MODEL = "openai/gpt-oss-20b:free"

# Cloudflare Workers AI — the one place the Workers AI model is named.
# worker/workers-ai.js reads env.WORKERS_AI_MODEL fresh on every
# request and never hardcodes a model, so switching models is a
# one-line change here plus a redeploy — no code edit.
#
# @cf/meta/llama-3.3-70b-instruct-fp8-fast was verified against
# Cloudflare's live model catalogue before this change:
#   - explicitly listed as REMAINING ACTIVE after the 30 May 2026
#     Workers AI deprecation wave (the "-fast variants remain active"
#     list), so this is not a model about to be retired
#   - 24,000-token context window — smaller than OpenRouter's 131K,
#     which is precisely why worker/workers-ai.js sends a bounded
#     deterministic digest instead of the raw 180-candle array
#   - function calling and batch inference supported
#   - $0.29 per M input tokens / $2.25 per M output tokens
# A cheaper routine alternative, also confirmed still active, is
# @cf/meta/llama-3.1-8b-instruct-fast — change this line only.
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Server-side default provider when a request doesn't specify one
# explicitly. An explicit client choice (from the AI Provider UI)
# always overrides this — this is only the fallback when nothing was
# specified. Flip to "gemini" any time to change the default with no
# code change. This does NOT cause silent fallback if the selected
# provider's key is missing — that still returns a clear error.
AI_PROVIDER = "openrouter"

# Phase 2C, Step 2 persists the FYERS OAuth access_token (and its
# expiry) across requests and Worker isolate recycles. No refresh_token/
# PIN logic is stored here or anywhere else in this project (Phase 2C
# Decision B: manual daily re-login only, no auto-refresh).
#
# Existing production namespace — id preserved unchanged from your
# current wrangler.toml. Do not replace this id with a placeholder.
[[kv_namespaces]]
binding = "FYERS_TOKENS"
id = "9bcd786979a94628826c9c35ff08fa01"

# Cloudflare Workers AI binding — the ONLY structural addition this
# phase makes to the Worker's configuration. Workers AI has no API
# key: access is granted by this binding, which exists only inside the
# Worker isolate and is never visible to the browser. Limited by
# Cloudflare to one AI binding per Worker.
#
# IMPORTANT: a binding is deployment-time configuration. A git push
# does NOT create it — the Worker must be redeployed with
# `wrangler deploy` before provider "workersai" can work live.
[ai]
binding = "AI"
